<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">

<!-- PWA / home-screen install (iOS + Android) -->
<link rel="manifest" href="app.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Project Greenfire">
<link rel="apple-touch-icon" href="assets/images/logo.png">
<!-- Base Styles -->
<link rel="stylesheet" href="styles/base/global.css">
<link rel="stylesheet" href="styles/base/game-area.css">
<!-- Layout Styles -->
<link rel="stylesheet" href="styles/layout/header-footer.css">
<link rel="stylesheet" href="styles/layout/navigation-menu.css">
<link rel="stylesheet" href="styles/layout/info-panel.css">
<!-- Component Styles -->
<link rel="stylesheet" href="styles/components/objectives.css">
<link rel="stylesheet" href="styles/components/ingamelog.css">
<link rel="stylesheet" href="styles/components/story-popup.css">
<!-- combat-popup.css moved to backup/styles/ -->
<link rel="stylesheet" href="styles/components/options-menu.css">
<link rel="stylesheet" href="styles/components/log-options.css">
<link rel="stylesheet" href="styles/components/changelog.css">
<!-- Section Styles -->
<!-- crafting.css moved to backup/styles/ -->
<link rel="stylesheet" href="styles/sections/explore.css">
<link rel="stylesheet" href="styles/sections/journal.css">
<link rel="stylesheet" href="styles/sections/character.css">
<!-- localMap.css intentionally omitted during refactor -->
<link rel="stylesheet" href="styles/sections/titleScreen.css">

<!-- Forced compact-mode overrides (used for iOS PWA desktop-viewport quirks) -->
<link rel="stylesheet" href="styles/base/compact-mode.css">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet">
	
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="engine/main.js" type="module"></script>

</head>

<body>
<div id="preloader">
        <img src="assets/images/logo.png" alt="Project Greenfire" class="preloader-logo">
        <div class="loader"></div>
        <p class="preloader-text">Loading assets...</p>
        <div class="preloader-bar">
            <div class="preloader-bar-fill" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
        </div>
        <p class="preloader-status"></p>
</div>

<div id="titleScreen" class="title-screen-overlay hidden" aria-hidden="true" hidden>
    <div class="title-screen-card" role="main" aria-label="Project Greenfire title screen">
        <img class="title-screen-logo" src="assets/images/logo-header.png" alt="Project Greenfire">
        <div class="title-screen-flags">
            <button id="titleLangEn" class="title-screen-flag" type="button" data-lang="en" title="English">
                <svg viewBox="0 0 60 40" class="flag-icon"><rect width="60" height="40" fill="#012169"/><path d="M0 0l60 40M60 0L0 40" stroke="#fff" stroke-width="6"/><path d="M0 0l60 40M60 0L0 40" stroke="#C8102E" stroke-width="3"/><rect width="18" height="40" fill="#012169" x="21"/><rect width="60" height="14" fill="#012169" y="13"/><path d="M30 0v40M0 20h60" stroke="#fff" stroke-width="10"/><path d="M30 0v40M0 20h60" stroke="#C8102E" stroke-width="4"/></svg> English
            </button>
            <button id="titleLangCs" class="title-screen-flag" type="button" data-lang="cs" title="Čeština">
                <svg viewBox="0 0 60 40" class="flag-icon"><rect width="60" height="20" fill="#fff"/><rect y="20" width="60" height="20" fill="#D7141A"/><polygon points="0,0 25,20 0,40" fill="#11457E"/></svg> Čeština
            </button>
        </div>
        <div class="title-screen-menu">
            <button id="titleContinueBtn" class="title-screen-btn" type="button">Continue</button>
            <button id="titleNewGameBtn" class="title-screen-btn" type="button">New Game</button>
            <button id="titleSettingsBtn" class="title-screen-btn secondary" type="button">Settings</button>
            <button id="titleChangelogBtn" class="title-screen-btn secondary" type="button">Changelog</button>
            <button id="titleExitBtn" class="title-screen-btn secondary" type="button" hidden>Exit</button>
        </div>
    </div>
</div>

<div id="header" class="hidden">
    <div class="header-left">
        <img id="gameLogo" src="assets/images/logo-header-nobg.png" alt="Project Greenfire">
    </div>
    <div class="header-center">
        <span id="headerClock" class="clock-display"></span>
    </div>
    <div class="header-right">
        <div class="header-links">
            <a href="#" id="optionsLink" class="header-link" data-locale="header_options">Options</a>
            <a href="#" id="saveLink" class="header-link" data-locale="header_save">Save</a>
            <a href="#" id="loadLink" class="header-link" data-locale="header_load">Load</a>
        </div>
        <span id="headerLangFlag" class="header-lang-flag" title="Language"></span>
    </div>
</div>

<div id="mainContainer" class="hidden">
<div id="mainMenu">
<button id="mainMenuCollapseBtn" class="panel-collapse-btn left-panel" title="Collapse menu">
    <svg class="collapse-chevron" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <polyline points="15 6 9 12 15 18"/>
        <polyline points="19 6 13 12 19 18"/>
    </svg>
</button>
<div class="panel-section-header menu-panel-header" data-locale="menu_main_menu">Main Menu</div>
<div class="menu-buttons-container"></div>
<div id="logSection">
    <div class="log-header">
        <h3 id="logHeaderTitle">Log entries:</h3>
		<button id="logOptionsBtn" title="Log Options">⚙️</button>
    </div>
    <div id="logContent"></div> </div>
</div>
<div id="gameArea" class="game-area"></div>
<div id="infoPanel">
<button id="infoPanelCollapseBtn" class="panel-collapse-btn right-panel" title="Collapse info panel">
    <svg class="collapse-chevron" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <polyline points="9 6 15 12 9 18"/>
        <polyline points="5 6 11 12 5 18"/>
    </svg>
</button>
<div id="infoPanelContent" class="info-section"></div>
<button id="endLoopBtn" class="menu-button end-loop-btn hidden">End Loop</button>
</div>
</div>
<div id="footer" class="hidden">
    <div class="footer-column">
        <div id="footerControls" class="footer-controls" aria-hidden="false">
            <button id="debugBtn" class="header-link" title="Toggle Debug Taxing Action">Debug</button>
        </div>
    </div>
    <div class="footer-column">
        
    </div>
    <div class="footer-column">
<button id="changelogBtn" class="header-link">v0.2.0</button>
    </div>
</div>

<div id="optionsMenu" class="options-menu-overlay hidden" hidden>
    <div class="options-menu-content">
        <div class="options-menu-header">
            <h3 data-locale="options_title">Options</h3>
            <span class="options-menu-close">&times;</span>
        </div>

        <div class="option-group" id="optionsSettingsGroup">
            <h4 data-locale="options_settings">Settings</h4>
            <div class="option-toggle">
                <label for="backgroundToggle" data-locale="options_run_background">Run in background</label>
                <input type="checkbox" id="backgroundToggle">
            </div>
            <div class="option-toggle">
                <label for="glowToggle" data-locale="options_glow_effects">Enable UI Glow Effects</label>
                <input type="checkbox" id="glowToggle">
            </div>
            <div class="option-toggle">
                <label for="confirmLoadToggle" data-locale="options_confirm_load">Confirm before load</label>
                <input type="checkbox" id="confirmLoadToggle">
            </div>
            <div class="option-toggle">
                <label for="confirmResetToggle" data-locale="options_confirm_reset">Confirm before reset</label>
                <input type="checkbox" id="confirmResetToggle">
            </div>
        </div>

        <div class="option-group" id="optionsGlowColorGroup">
            <h4 data-locale="options_glow_color">UI Glow Color</h4>
            <div id="colorPickerContainer">
				<button class="color-swatch" data-color="green" title="Sci-Fi Green"></button>
                <button class="color-swatch" data-color="blue" title="Cyber Blue"></button>
                <button class="color-swatch" data-color="purple" title="Void Purple"></button>
                <button class="color-swatch" data-color="gold" title="Warm Gold"></button>
                <button class="color-swatch" data-color="cyan" title="Neon Cyan"></button>
                <button class="color-swatch" data-color="teal" title="Deep Teal"></button>
                <button class="color-swatch" data-color="orange" title="Amber Orange"></button>
                <button class="color-swatch" data-color="red" title="Alert Red"></button>
                <button class="color-swatch" data-color="pink" title="Magenta Pink"></button>
                <button class="color-swatch" data-color="lime" title="Lime"></button>
                <button class="color-swatch" data-color="white" title="White"></button>
                <button class="color-swatch" data-color="black" title="Glow Off"></button>
            </div>
        </div>

        <div class="option-group popup-span-all">
            <h4 data-locale="options_glow_intensity">Glow Intensity</h4>
            <input type="range" id="glowIntensitySlider" min="0" max="100" step="1" value="70">
        </div>

        <div class="option-group popup-span-all">
            <h4 data-locale="options_language">Language</h4>
            <div class="language-flags">
                <button id="optLangEn" class="language-flag-btn" type="button" data-lang="en" title="English">
                    <svg viewBox="0 0 60 40" class="flag-icon"><rect width="60" height="40" fill="#012169"/><path d="M0 0l60 40M60 0L0 40" stroke="#fff" stroke-width="6"/><path d="M0 0l60 40M60 0L0 40" stroke="#C8102E" stroke-width="3"/><rect width="18" height="40" fill="#012169" x="21"/><rect width="60" height="14" fill="#012169" y="13"/><path d="M30 0v40M0 20h60" stroke="#fff" stroke-width="10"/><path d="M30 0v40M0 20h60" stroke="#C8102E" stroke-width="4"/></svg>
                    <span>English</span>
                </button>
                <button id="optLangCs" class="language-flag-btn" type="button" data-lang="cs" title="Čeština">
                    <svg viewBox="0 0 60 40" class="flag-icon"><rect width="60" height="20" fill="#fff"/><rect y="20" width="60" height="20" fill="#D7141A"/><polygon points="0,0 25,20 0,40" fill="#11457E"/></svg>
                    <span>Čeština</span>
                </button>
                <button class="language-flag-btn flag-disabled" type="button" disabled title="Coming soon">
                    <svg viewBox="0 0 60 40" class="flag-icon"><rect width="60" height="40" fill="#444"/></svg>
                    <span>???</span>
                </button>
                <button class="language-flag-btn flag-disabled" type="button" disabled title="Coming soon">
                    <svg viewBox="0 0 60 40" class="flag-icon"><rect width="60" height="40" fill="#444"/></svg>
                    <span>???</span>
                </button>
                <button class="language-flag-btn flag-disabled" type="button" disabled title="Coming soon">
                    <svg viewBox="0 0 60 40" class="flag-icon"><rect width="60" height="40" fill="#444"/></svg>
                    <span>???</span>
                </button>
            </div>
        </div>

        <div class="option-group save-management popup-span-all">
            <h4 data-locale="options_save_management">Save Management</h4>

            <div id="importContainer">
                <textarea id="importSaveText" placeholder="Paste exported save here"></textarea>
                <div class="save-controls">
                    <button id="exportSaveButton" class="menu-button options-menu-btn" type="button">Export to Clipboard</button>
                    <button id="importSaveButton" class="menu-button options-menu-btn" type="button">Import</button>
                </div>
                <div id="saveMgmtStatus" class="save-mgmt-status" aria-live="polite">
                    Export copies an encrypted save to your clipboard.
                </div>
            </div>
        </div>

        <div class="option-group popup-span-all">
            <h4 data-locale="options_reset_progress">Reset Progress</h4>
            <div style="display:flex;flex-direction:column;gap:10px">
                <button id="resetButton" class="danger" data-locale="options_reset_progress">Reset Progress</button>
            </div>
        </div>
</div>
</div>

<div id="logOptionsMenu" class="log-options-overlay hidden" hidden>
    <div class="log-options-content">
        <div class="log-options-header">
            <h3 data-locale="log_title">Log Options</h3>
            <span class="log-options-close">&times;</span>
        </div>

        <div class="log-options-body">
            <div class="log-option-group">
                <h4 data-locale="log_display">Display</h4>
                <div class="log-option-toggle">
                    <label for="logTimestampsToggle" data-locale="log_show_timestamps">Show timestamps</label>
                    <input type="checkbox" id="logTimestampsToggle">
                </div>
                <div class="log-option-toggle">
                    <label for="logTypewriterToggle" data-locale="log_typewriter_effect">Typewriter effect</label>
                    <input type="checkbox" id="logTypewriterToggle">
                </div>
            </div>

            <div class="log-option-group">
                <h4 data-locale="log_filters">Filters</h4>
                <div id="logFiltersContainer"></div>
            </div>

            <div class="log-option-group span-all">
                <h4 data-locale="log_colors">Colors</h4>
                <div id="logColorsContainer"></div>
            </div>

            <div class="log-option-group span-all">
                <button id="resetLogColorsBtn" class="log-option-button" data-locale="log_reset_colors">Reset Colors to Default</button>
            </div>
        </div>
    </div>
</div>

<div id="storyPopup" class="story-popup-overlay hidden" hidden>
    <div class="story-popup-content">
        <span class="story-popup-close">&times;</span>
        <div class="story-popup-header">
            <h2 id="popupTitle"></h2>
        </div>
        <div class="story-popup-body">
            <div class="story-popup-text">
                <p id="popupMessage"></p>
                <div id="popupOutcome" class="popup-outcome hidden"></div>
            </div>
        </div>
        <div class="story-popup-nav">
            <button id="popupClose">Close (Esc)</button>
        </div>
    </div>
</div>

<div id="changelogPopup" class="changelog-overlay hidden">
    <div class="changelog-content">
        <div class="changelog-header">
            <h3>Changelog</h3>
            <span class="changelog-close">&times;</span>
        </div>
        <div id="changelogBody">
            </div>
    </div>
</div>
  
</body>
</html>
