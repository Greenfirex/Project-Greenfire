<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="metal" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#d8dde3"/>
      <stop offset="1" stop-color="#8f9aa6"/>
    </linearGradient>
    <linearGradient id="water" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#6bd0ff"/>
      <stop offset="1" stop-color="#1f79d6"/>
    </linearGradient>
  </defs>

  <!-- Body -->
  <rect x="20" y="16" width="24" height="40" rx="6" fill="url(#metal)" stroke="#2b2b2b" stroke-width="2"/>

  <!-- Neck -->
  <rect x="26" y="10" width="12" height="10" rx="3" fill="url(#metal)" stroke="#2b2b2b" stroke-width="2"/>

  <!-- Cap -->
  <rect x="24" y="6" width="16" height="8" rx="3" fill="#2b2b2b" opacity="0.85"/>

  <!-- Water window -->
  <rect x="24" y="26" width="16" height="24" rx="4" fill="url(#water)" opacity="0.9"/>
  <path d="M24 34h16" stroke="#ffffff" stroke-width="2" opacity="0.25"/>

  <!-- Strap ring -->
  <path d="M44 22c6 0 10 4 10 10s-4 10-10 10" fill="none" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"/>
</svg>
