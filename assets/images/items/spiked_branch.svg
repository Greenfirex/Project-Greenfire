<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Spiked branch icon">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff7df" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#7fe3aa" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d2a46d" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#8b5a2b" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Card background (matches other item icons) -->
  <rect x="10" y="10" width="108" height="108" rx="18" fill="rgba(0,0,0,0.35)" stroke="rgba(105,240,174,0.55)" stroke-width="2"/>

  <!-- Branch shaft -->
  <path d="M30 92
           C44 78, 58 64, 70 48
           C77 39, 86 34, 98 30" stroke="url(#wood)" stroke-width="14" stroke-linecap="round" fill="none"/>

  <!-- Bark shading -->
  <path d="M33 89
           C47 75, 60 62, 72 46
           C79 37, 88 32, 100 28" stroke="rgba(0,0,0,0.25)" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Spikes (simple triangles) -->
  <path d="M54 70 L60 58 L66 72 Z" fill="rgba(0,0,0,0.45)"/>
  <path d="M70 54 L78 44 L80 60 Z" fill="rgba(0,0,0,0.45)"/>
  <path d="M40 84 L46 74 L52 86 Z" fill="rgba(0,0,0,0.45)"/>

  <!-- Small side twig -->
  <path d="M60 66 C58 56, 58 48, 62 42" stroke="url(#wood)" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Tip accent -->
  <circle cx="99" cy="30" r="5" fill="rgba(255,255,255,0.18)"/>

  <!-- Subtle inner glow -->
  <path d="M28 92 C40 82, 52 72, 64 60" stroke="rgba(255,255,255,0.10)" stroke-width="6" stroke-linecap="round" fill="none"/>
</svg>
