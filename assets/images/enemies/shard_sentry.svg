<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Shard sentry">
  <defs>
    <linearGradient id="alloy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef3f7" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#9aa7b2" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#49535b" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#74b7ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0b2a66" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="18" y="18" width="220" height="220" rx="28" fill="rgba(0,0,0,0.28)" stroke="rgba(255,255,255,0.10)"/>

  <g filter="url(#shadow)">
    <!-- Floating shard body -->
    <path d="M128 62l46 38-10 70-36 24-36-24-10-70 46-38z" fill="url(#alloy)"/>
    <path d="M128 78l30 24-8 52-22 14-22-14-8-52 30-24z" fill="rgba(0,0,0,0.16)"/>

    <!-- Core -->
    <circle cx="128" cy="130" r="18" fill="rgba(0,0,0,0.35)" stroke="rgba(255,255,255,0.18)"/>
    <circle cx="128" cy="130" r="9" fill="url(#core)"/>
    <circle cx="124" cy="126" r="3" fill="rgba(255,255,255,0.45)"/>

    <!-- Fracture lines -->
    <path d="M108 102l-10 18 14 12" stroke="rgba(0,0,0,0.28)" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M150 100l8 18-12 14" stroke="rgba(0,0,0,0.26)" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Shrapnel fins -->
    <path d="M78 140l-26 10 18 14 22-8z" fill="rgba(120,140,155,0.90)"/>
    <path d="M178 140l26 10-18 14-22-8z" fill="rgba(120,140,155,0.90)"/>

    <!-- Sparks -->
    <path d="M164 70l10-14 4 10 10-6-8 12" fill="rgba(255,216,74,0.9)"/>
    <path d="M92 188l-10 14-4-10-10 6 8-12" fill="rgba(255,216,74,0.85)"/>
  </g>
</svg>
