<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Spore hound">
  <defs>
    <linearGradient id="hide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9dbe2" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#7a7f90" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#353743" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="fungus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98cff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#5a1a7a" stop-opacity="0.60"/>
    </linearGradient>
    <linearGradient id="eyeGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dffb2" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0c6a33" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="18" y="18" width="220" height="220" rx="28" fill="rgba(0,0,0,0.28)" stroke="rgba(255,255,255,0.10)"/>

  <g filter="url(#shadow)">
    <!-- Torso -->
    <path d="M64 154c10-32 36-58 78-58 32 0 52 12 66 28-6 36-32 68-78 68-30 0-52-12-66-38z" fill="url(#hide)"/>
    <path d="M78 156c10-22 30-40 58-40 24 0 38 8 48 18-10 24-30 44-58 44-24 0-38-8-48-22z" fill="rgba(0,0,0,0.16)"/>

    <!-- Head -->
    <path d="M66 150c2-20 14-38 34-44 18-6 34 2 44 16-2 22-16 42-36 48-18 6-34-2-42-20z" fill="url(#hide)"/>

    <!-- Jaw -->
    <path d="M78 168c6 8 16 12 28 8 12-4 22-16 26-28-10 10-22 14-30 16-10 2-18 2-24 4z" fill="rgba(0,0,0,0.26)"/>

    <!-- Legs -->
    <g stroke="rgba(0,0,0,0.45)" stroke-width="5" stroke-linecap="round">
      <path d="M104 186l-8 18"/>
      <path d="M132 188l0 18"/>
      <path d="M166 182l8 18"/>
      <path d="M196 168l14 12"/>
    </g>

    <!-- Fungal growths -->
    <g>
      <path d="M140 92c-6-16 4-30 18-32 16-2 28 10 28 26 0 12-8 22-18 26-10 4-22 0-28-20z" fill="url(#fungus)"/>
      <path d="M118 100c-4-14 4-24 16-26 14-2 24 8 24 20 0 10-6 18-14 22-8 4-18 2-26-16z" fill="url(#fungus)" opacity="0.9"/>
      <circle cx="170" cy="78" r="5" fill="rgba(255,255,255,0.28)"/>
      <circle cx="150" cy="90" r="4" fill="rgba(255,255,255,0.22)"/>
    </g>

    <!-- Spores -->
    <g fill="rgba(255,255,255,0.22)">
      <circle cx="200" cy="70" r="3"/>
      <circle cx="210" cy="90" r="2"/>
      <circle cx="188" cy="56" r="2"/>
      <circle cx="218" cy="68" r="2"/>
    </g>

    <!-- Eyes -->
    <circle cx="86" cy="142" r="9" fill="rgba(0,0,0,0.35)" stroke="rgba(255,255,255,0.18)"/>
    <circle cx="86" cy="142" r="4.5" fill="url(#eyeGlow)"/>
    <circle cx="83" cy="139" r="2.2" fill="rgba(255,255,255,0.45)"/>

    <!-- Scar -->
    <path d="M124 128c8 6 14 14 16 26" stroke="rgba(0,0,0,0.26)" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
