<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Thorncrawler">
  <defs>
    <linearGradient id="carapace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfe0b6" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#6f8e56" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#2e3a28" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="underside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1f18" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.20"/>
    </linearGradient>
    <linearGradient id="eyeGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b2d" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#8a1a00" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="18" y="18" width="220" height="220" rx="28" fill="rgba(0,0,0,0.28)" stroke="rgba(255,255,255,0.10)"/>

  <g filter="url(#shadow)">
    <!-- Body spine -->
    <path d="M64 146c10-28 34-52 70-52 38 0 58 18 70 40-10 30-34 54-70 54-38 0-58-18-70-42z" fill="url(#carapace)"/>
    <path d="M70 148c12-22 34-40 62-40 32 0 50 14 60 30-12 24-34 42-62 42-32 0-50-14-60-32z" fill="rgba(0,0,0,0.14)"/>

    <!-- Segments -->
    <g opacity="0.95">
      <ellipse cx="92" cy="146" rx="16" ry="20" fill="url(#underside)"/>
      <ellipse cx="116" cy="138" rx="18" ry="22" fill="url(#underside)"/>
      <ellipse cx="142" cy="136" rx="18" ry="22" fill="url(#underside)"/>
      <ellipse cx="168" cy="142" rx="18" ry="22" fill="url(#underside)"/>
    </g>

    <!-- Legs / thorns -->
    <g stroke="rgba(0,0,0,0.45)" stroke-width="4" stroke-linecap="round">
      <path d="M90 162l-18 14"/>
      <path d="M104 166l-16 18"/>
      <path d="M122 168l-10 20"/>
      <path d="M140 168l10 20"/>
      <path d="M158 166l16 18"/>
      <path d="M174 162l18 14"/>
    </g>

    <!-- Dorsal spikes -->
    <g fill="rgba(30,40,26,0.85)">
      <path d="M102 104l10-18 6 18-8 6z"/>
      <path d="M128 96l10-18 6 18-8 6z"/>
      <path d="M154 104l10-18 6 18-8 6z"/>
    </g>

    <!-- Head -->
    <path d="M62 150c2-18 14-32 30-36 14-4 26 2 32 12-2 18-14 34-30 38-14 4-26-2-32-14z" fill="url(#carapace)"/>
    <path d="M64 150c4-10 14-18 26-20 10-2 18 2 22 8" stroke="rgba(255,255,255,0.14)" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Eyes -->
    <circle cx="78" cy="144" r="8" fill="rgba(0,0,0,0.35)" stroke="rgba(255,255,255,0.18)"/>
    <circle cx="78" cy="144" r="4" fill="url(#eyeGlow)"/>
    <circle cx="75" cy="141" r="2" fill="rgba(255,255,255,0.40)"/>

    <!-- Mandibles -->
    <path d="M64 156l-14 8 6 10 16-10" fill="rgba(0,0,0,0.22)"/>
    <path d="M70 164l-10 14 10-4 6 8" fill="rgba(0,0,0,0.18)"/>

    <!-- Scars -->
    <path d="M150 122c-10 8-14 16-14 26" stroke="rgba(0,0,0,0.26)" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
