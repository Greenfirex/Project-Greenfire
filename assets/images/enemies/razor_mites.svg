<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Razor mites">
  <defs>
    <linearGradient id="chitin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8d0c6" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#8a8178" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#3c3530" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fbff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#8ea0ad" stop-opacity="0.70"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="18" y="18" width="220" height="220" rx="28" fill="rgba(0,0,0,0.28)" stroke="rgba(255,255,255,0.10)"/>

  <g filter="url(#shadow)">
    <!-- Swarm mass -->
    <path d="M58 162c0-44 34-78 78-78s78 34 78 78-34 66-78 66-78-22-78-66z" fill="rgba(0,0,0,0.18)"/>

    <!-- Individual mites (clustered) -->
    <g>
      <ellipse cx="102" cy="156" rx="26" ry="22" fill="url(#chitin)"/>
      <ellipse cx="146" cy="148" rx="30" ry="24" fill="url(#chitin)"/>
      <ellipse cx="128" cy="184" rx="32" ry="24" fill="url(#chitin)" opacity="0.95"/>
    </g>

    <!-- Razor blades / mandibles -->
    <g>
      <path d="M86 156l-34 8 18-22 26 8z" fill="url(#blade)"/>
      <path d="M166 148l34 8-18-22-26 8z" fill="url(#blade)"/>
      <path d="M128 184l-10 34 24-14 2-26z" fill="url(#blade)" opacity="0.9"/>
    </g>

    <!-- Legs -->
    <g stroke="rgba(0,0,0,0.45)" stroke-width="4" stroke-linecap="round">
      <path d="M98 170l-18 14"/>
      <path d="M112 174l-12 18"/>
      <path d="M148 170l18 14"/>
      <path d="M160 166l12 18"/>
      <path d="M126 198l-8 18"/>
      <path d="M138 196l8 18"/>
    </g>

    <!-- Eyes (glints) -->
    <g>
      <circle cx="94" cy="150" r="4" fill="rgba(0,0,0,0.35)"/>
      <circle cx="94" cy="150" r="2" fill="rgba(255,90,64,0.70)"/>
      <circle cx="154" cy="142" r="4" fill="rgba(0,0,0,0.35)"/>
      <circle cx="154" cy="142" r="2" fill="rgba(255,90,64,0.70)"/>
      <circle cx="132" cy="178" r="4" fill="rgba(0,0,0,0.35)"/>
      <circle cx="132" cy="178" r="2" fill="rgba(255,90,64,0.70)"/>
    </g>

    <!-- Scratches -->
    <path d="M122 118c14 8 20 18 22 32" stroke="rgba(0,0,0,0.25)" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
